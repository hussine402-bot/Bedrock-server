name: Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download & Extract Bedrock Server
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip libcurl4

        curl -sSL -o bedrock-server.zip "https://files.catbox.moe/810r6e.zip"
        unzip -o bedrock-server.zip -d server
        cd server
        chmod +x bedrock_server

    - name: Configure Server Settings
      run: |
        cd server
        sed -i 's/online-mode=true/online-mode=false/g' server.properties
        sed -i 's/allow-list=true/allow-list=false/g' server.properties
        sed -i 's/white-list=true/white-list=false/g' server.properties

    - name: Setup Tunnel & Run Server
      run: |
        # تحميل وتجهيز pinggy للربط المباشر
        curl -shttps://ssh.pinggy.io > pinggy.sh
        
        # تشغيل النفق وتوليد الـ IP والـ Port بوضوح
        ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:19132 qr@a.pinggy.io UDP > tunnel.log 2>&1 &
        
        # تشغيل سيرفر ماين كرافت
        cd server
        LD_LIBRARY_PATH=. ./bedrock_server &
        
        # الانتظار وطباعة عنوان الـ IP والـ Port المباشر
        sleep 8
        echo "=========================================="
        echo "👇 عنوان السيرفر والـ Port المباشر للعب 👇"
        cat ../tunnel.log | grep -o 'a.pinggy.io:[0-9]*' || cat ../tunnel.log
        echo "=========================================="
        wait
        
