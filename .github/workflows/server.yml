name: Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download & Extract Bedrock Server
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip libcurl4

        curl -sSL -o bedrock-server.zip "https://files.catbox.moe/810r6e.zip"
        unzip -o bedrock-server.zip -d server
        cd server
        chmod +x bedrock_server

    - name: Configure Server Settings
      run: |
        cd server
        sed -i 's/online-mode=true/online-mode=false/g' server.properties
        sed -i 's/allow-list=true/allow-list=false/g' server.properties
        sed -i 's/white-list=true/white-list=false/g' server.properties

    - name: Run Playit & Bedrock Server
      run: |
        curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
        chmod +x playit
        ./playit &
        sleep 5
        
        cd server
        LD_LIBRARY_PATH=. ./bedrock_server
        
