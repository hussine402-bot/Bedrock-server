name: Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download & Extract Bedrock Server
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip libcurl4
        
        # جلب رابط أحدث نسخة سيرفر من موقع ماين كرافت الرسمي تلقائياً
        DOWNLOAD_URL=$(curl -sH "User-Agent: Mozilla/5.0" https://www.minecraft.net/en-us/download/server/bedrock | grep -oP 'https://www.minecraft.net/bedrockdotsite/bin-linux/bedrock-server-[^"]+' | head -n 1)
        
        # إذا لم يتم استخراج الرابط تلقائياً، استخدم الرابط المباشر المحدث
        if [ -z "$DOWNLOAD_URL" ]; then
          DOWNLOAD_URL="https://www.minecraft.net/bedrockdotsite/bin-linux/bedrock-server-1.21.0.03.zip"
        fi
        
        echo "Downloading from: $DOWNLOAD_URL"
        curl -H "User-Agent: Mozilla/5.0" -o bedrock-server.zip "$DOWNLOAD_URL"
        
        unzip -o bedrock-server.zip -d server
        cd server
        chmod +x bedrock_server

    - name: Enable Cracked Mode (online-mode=false)
      run: |
        cd server
        sed -i 's/online-mode=true/online-mode=false/g' server.properties

    - name: Setup & Run Playit.gg Tunnel
      run: |
        curl -SsL https://playit-cloud.github.io/ppa/key.gpg | sudo apt-key add -
        sudo curl -SsL -o /etc/apt/sources.list.d/playit-cloud.list https://playit-cloud.github.io/ppa/playit-cloud.list
        sudo apt-get update
        sudo apt-get install playit -y
        playit &

    - name: Run Minecraft Bedrock Server
      run: |
        cd server
        LD_LIBRARY_PATH=. ./bedrock_server
        
