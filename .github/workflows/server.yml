name: Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download & Extract Bedrock Server
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip libcurl4 wget python3

        # جلب رابط التحميل المباشر من صفحة ماين كرافت الرسمية
        DOWNLOAD_URL=$(curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" https://www.minecraft.net/en-us/download/server/bedrock | grep -oP 'https://[^\"]+bedrock-server-[^\"]+\.zip' | head -n 1)

        # في حال عدم التمكن من جلب الرابط، يتم استخدام رابط مجرب ومباشر
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Using Fallback Link..."
          DOWNLOAD_URL="https://minecraft.net/bedrockdotsite/bin-linux/bedrock-server-1.21.2.02.zip"
        fi

        echo "Downloading Bedrock Server from: $DOWNLOAD_URL"
        curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o bedrock-server.zip "$DOWNLOAD_URL"

        # فك الضغط وإعطاء صلاحيات التشغيل
        unzip -o bedrock-server.zip -d server
        cd server
        chmod +x bedrock_server

    - name: Enable Cracked Mode (online-mode=false)
      run: |
        cd server
        sed -i 's/online-mode=true/online-mode=false/g' server.properties

    - name: Setup & Run Playit.gg Tunnel
      run: |
        curl -SsL https://playit-cloud.github.io/ppa/key.gpg | sudo apt-key add -
        sudo curl -SsL -o /etc/apt/sources.list.d/playit-cloud.list https://playit-cloud.github.io/ppa/playit-cloud.list
        sudo apt-get update
        sudo apt-get install playit -y
        playit &

    - name: Run Minecraft Bedrock Server
      run: |
        cd server
        LD_LIBRARY_PATH=. ./bedrock_server
        
