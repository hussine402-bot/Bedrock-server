name: Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download & Extract Bedrock Server
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip libcurl4 wget

        # جلب أحدث رابط مباشر رسمي من ماين كرافت
        URL="https://www.minecraft.net/bedrockdotsite/bin-linux/bedrock-server-1.21.2.02.zip"
        
        # استخدام wget مع تجاوز التحويلات وإرسال Header كامل
        wget --no-check-certificate --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:125.0) Gecko/20100101 Firefox/125.0" -O bedrock-server.zip "$URL" || \
        curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o bedrock-server.zip "https://github.com/BedrockDev/bedrock-server/releases/download/v1.21.2.02/bedrock-server-1.21.2.02.zip"

        # التأكد من فك الضغط بنجاح
        unzip -o bedrock-server.zip -d server || (echo "فشل التحميل من المصدر الأول، جاري التحميل من المصدر الاحتياطي..." && curl -sSL -o bedrock-server.zip "https://raw.githubusercontent.com/BedrockDev/bedrock-files/main/bedrock-server-latest.zip" && unzip -o bedrock-server.zip -d server)
        
        cd server
        chmod +x bedrock_server

    - name: Enable Cracked Mode (online-mode=false)
      run: |
        cd server
        sed -i 's/online-mode=true/online-mode=false/g' server.properties

    - name: Setup & Run Playit.gg Tunnel
      run: |
        curl -SsL https://playit-cloud.github.io/ppa/key.gpg | sudo apt-key add -
        sudo curl -SsL -o /etc/apt/sources.list.d/playit-cloud.list https://playit-cloud.github.io/ppa/playit-cloud.list
        sudo apt-get update
        sudo apt-get install playit -y
        playit &

    - name: Run Minecraft Bedrock Server
      run: |
        cd server
        LD_LIBRARY_PATH=. ./bedrock_server
